components:
  schemas:
    AccessRequirements:
      additionalProperties: false
      properties:
        lift_required_above_floor:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          description: A lift is needed for floors above this level.
          title: Lift Required Above Floor
        max_walk_to_stop_m:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: Max Walk To Stop M
        step_free_entrance_required:
          default: false
          title: Step Free Entrance Required
          type: boolean
        wheelchair_user:
          default: false
          title: Wheelchair User
          type: boolean
      title: AccessRequirements
      type: object
    AssessmentRequest:
      additionalProperties: false
      properties:
        profile_id:
          minLength: 1
          title: Profile Id
          type: string
        property_id:
          minLength: 1
          title: Property Id
          type: string
        upload_ids:
          description: Uploaded evidence to include in the report.
          items:
            type: string
          title: Upload Ids
          type: array
      required:
      - profile_id
      - property_id
      title: AssessmentRequest
      type: object
    Body_create_upload_v1_uploads_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          description: The photo, floor plan or document.
          title: File
          type: string
        kind:
          $ref: '#/components/schemas/UploadKind'
          description: What the file is.
        property_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Property the evidence is about, if any.
          title: Property Id
      required:
      - file
      - kind
      title: Body_create_upload_v1_uploads_post
      type: object
    BudgetComparison:
      description: Estimated monthly total compared with the renter's stated budget.
      enum:
      - within
      - over
      - unknown
      title: BudgetComparison
      type: string
    CitedFact:
      additionalProperties: false
      description: A named input a finding relied on, with its provenance.
      properties:
        evidence:
          $ref: '#/components/schemas/Evidence_FactValue_'
        name:
          minLength: 1
          title: Name
          type: string
      required:
      - name
      - evidence
      title: CitedFact
      type: object
    CostBreakdown:
      additionalProperties: false
      properties:
        budget_comparison:
          $ref: '#/components/schemas/BudgetComparison'
        budget_monthly_gbp:
          anyOf:
          - type: number
          - type: 'null'
          title: Budget Monthly Gbp
        lines:
          items:
            $ref: '#/components/schemas/CostLine'
          title: Lines
          type: array
        profile_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile Id
        property_id:
          title: Property Id
          type: string
        total_high_gbp:
          anyOf:
          - type: number
          - type: 'null'
          title: Total High Gbp
        total_low_gbp:
          anyOf:
          - type: number
          - type: 'null'
          title: Total Low Gbp
        total_monthly_gbp:
          $ref: '#/components/schemas/Evidence_float_'
          description: Central total; insufficient when any line is insufficient.
      required:
      - property_id
      - lines
      - total_monthly_gbp
      - budget_comparison
      title: CostBreakdown
      type: object
    CostKind:
      enum:
      - rent
      - council_tax
      - energy
      - other
      title: CostKind
      type: string
    CostLine:
      additionalProperties: false
      properties:
        high_gbp:
          anyOf:
          - type: number
          - type: 'null'
          title: High Gbp
        kind:
          $ref: '#/components/schemas/CostKind'
        label:
          title: Label
          type: string
        low_gbp:
          anyOf:
          - type: number
          - type: 'null'
          title: Low Gbp
        monthly_gbp:
          $ref: '#/components/schemas/Evidence_float_'
          description: Central monthly estimate.
      required:
      - kind
      - label
      - monthly_gbp
      title: CostLine
      type: object
    CostRequest:
      additionalProperties: false
      properties:
        profile_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Profile whose budget and other costs to use. Without it, the budget comparison
            is 'unknown'.
          title: Profile Id
      title: CostRequest
      type: object
    CouncilTaxBand:
      enum:
      - A
      - B
      - C
      - D
      - E
      - F
      - G
      - H
      title: CouncilTaxBand
      type: string
    CurrentUser:
      additionalProperties: false
      description: The signed-in user, from verified access-token claims. Never includes the token.
      properties:
        email:
          anyOf:
          - type: string
          - type: 'null'
          description: Email, when the token carries the configured email claim.
          title: Email
        sub:
          description: Auth0 user id (the token's `sub` claim).
          minLength: 1
          title: Sub
          type: string
      required:
      - sub
      title: CurrentUser
      type: object
    Destination:
      additionalProperties: false
      properties:
        latitude:
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        longitude:
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          type: number
        max_travel_minutes:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: Max Travel Minutes
        name:
          minLength: 1
          title: Name
          type: string
      required:
      - name
      - latitude
      - longitude
      title: Destination
      type: object
    EnumCatalog:
      additionalProperties: false
      description: Every enum used in the contract, with display labels.
      properties:
        enums:
          additionalProperties:
            items:
              $ref: '#/components/schemas/EnumOption'
            type: array
          title: Enums
          type: object
      required:
      - enums
      title: EnumCatalog
      type: object
    EnumOption:
      additionalProperties: false
      properties:
        label:
          description: Human-readable label to show instead of the raw value.
          title: Label
          type: string
        value:
          title: Value
          type: string
      required:
      - value
      - label
      title: EnumOption
      type: object
    EpcBand:
      enum:
      - A
      - B
      - C
      - D
      - E
      - F
      - G
      title: EpcBand
      type: string
    EvidenceQuality:
      description: Quality of the uploaded evidence a signal was derived from.
      enum:
      - good
      - limited
      - poor
      title: EvidenceQuality
      type: string
    Evidence_CouncilTaxBand_:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Date the source refers to or was read.
          title: As Of
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Calibrated model confidence; only allowed when origin is 'model'.
          title: Confidence
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        origin:
          $ref: '#/components/schemas/Origin'
          description: Where the value came from.
        source:
          description: Named source, e.g. a dataset or 'listing'.
          minLength: 1
          title: Source
          type: string
        status:
          $ref: '#/components/schemas/Status'
        value:
          anyOf:
          - $ref: '#/components/schemas/CouncilTaxBand'
          - type: 'null'
          description: The value, or null when evidence is insufficient.
      required:
      - value
      - origin
      - source
      - status
      title: Evidence[CouncilTaxBand]
      type: object
    Evidence_EpcBand_:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Date the source refers to or was read.
          title: As Of
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Calibrated model confidence; only allowed when origin is 'model'.
          title: Confidence
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        origin:
          $ref: '#/components/schemas/Origin'
          description: Where the value came from.
        source:
          description: Named source, e.g. a dataset or 'listing'.
          minLength: 1
          title: Source
          type: string
        status:
          $ref: '#/components/schemas/Status'
        value:
          anyOf:
          - $ref: '#/components/schemas/EpcBand'
          - type: 'null'
          description: The value, or null when evidence is insufficient.
      required:
      - value
      - origin
      - source
      - status
      title: Evidence[EpcBand]
      type: object
    Evidence_FactValue_:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Date the source refers to or was read.
          title: As Of
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Calibrated model confidence; only allowed when origin is 'model'.
          title: Confidence
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        origin:
          $ref: '#/components/schemas/Origin'
          description: Where the value came from.
        source:
          description: Named source, e.g. a dataset or 'listing'.
          minLength: 1
          title: Source
          type: string
        status:
          $ref: '#/components/schemas/Status'
        value:
          anyOf:
          - $ref: '#/components/schemas/FactValue'
          - type: 'null'
          description: The value, or null when evidence is insufficient.
      required:
      - value
      - origin
      - source
      - status
      title: Evidence[FactValue]
      type: object
    Evidence_MainFuel_:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Date the source refers to or was read.
          title: As Of
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Calibrated model confidence; only allowed when origin is 'model'.
          title: Confidence
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        origin:
          $ref: '#/components/schemas/Origin'
          description: Where the value came from.
        source:
          description: Named source, e.g. a dataset or 'listing'.
          minLength: 1
          title: Source
          type: string
        status:
          $ref: '#/components/schemas/Status'
        value:
          anyOf:
          - $ref: '#/components/schemas/MainFuel'
          - type: 'null'
          description: The value, or null when evidence is insufficient.
      required:
      - value
      - origin
      - source
      - status
      title: Evidence[MainFuel]
      type: object
    Evidence_PropertyType_:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Date the source refers to or was read.
          title: As Of
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Calibrated model confidence; only allowed when origin is 'model'.
          title: Confidence
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        origin:
          $ref: '#/components/schemas/Origin'
          description: Where the value came from.
        source:
          description: Named source, e.g. a dataset or 'listing'.
          minLength: 1
          title: Source
          type: string
        status:
          $ref: '#/components/schemas/Status'
        value:
          anyOf:
          - $ref: '#/components/schemas/PropertyType'
          - type: 'null'
          description: The value, or null when evidence is insufficient.
      required:
      - value
      - origin
      - source
      - status
      title: Evidence[PropertyType]
      type: object
    Evidence_bool_:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Date the source refers to or was read.
          title: As Of
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Calibrated model confidence; only allowed when origin is 'model'.
          title: Confidence
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        origin:
          $ref: '#/components/schemas/Origin'
          description: Where the value came from.
        source:
          description: Named source, e.g. a dataset or 'listing'.
          minLength: 1
          title: Source
          type: string
        status:
          $ref: '#/components/schemas/Status'
        value:
          anyOf:
          - type: boolean
          - type: 'null'
          description: The value, or null when evidence is insufficient.
          title: Value
      required:
      - value
      - origin
      - source
      - status
      title: Evidence[bool]
      type: object
    Evidence_float_:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Date the source refers to or was read.
          title: As Of
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Calibrated model confidence; only allowed when origin is 'model'.
          title: Confidence
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        origin:
          $ref: '#/components/schemas/Origin'
          description: Where the value came from.
        source:
          description: Named source, e.g. a dataset or 'listing'.
          minLength: 1
          title: Source
          type: string
        status:
          $ref: '#/components/schemas/Status'
        value:
          anyOf:
          - type: number
          - type: 'null'
          description: The value, or null when evidence is insufficient.
          title: Value
      required:
      - value
      - origin
      - source
      - status
      title: Evidence[float]
      type: object
    Evidence_int_:
      additionalProperties: false
      properties:
        as_of:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Date the source refers to or was read.
          title: As Of
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Calibrated model confidence; only allowed when origin is 'model'.
          title: Confidence
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        origin:
          $ref: '#/components/schemas/Origin'
          description: Where the value came from.
        source:
          description: Named source, e.g. a dataset or 'listing'.
          minLength: 1
          title: Source
          type: string
        status:
          $ref: '#/components/schemas/Status'
        value:
          anyOf:
          - type: integer
          - type: 'null'
          description: The value, or null when evidence is insufficient.
          title: Value
      required:
      - value
      - origin
      - source
      - status
      title: Evidence[int]
      type: object
    FactValue:
      anyOf:
      - type: string
      - type: integer
      - type: number
      - type: boolean
    FieldError:
      additionalProperties: false
      properties:
        loc:
          description: Path to the offending field.
          items:
            anyOf:
            - type: string
            - type: integer
          title: Loc
          type: array
        msg:
          title: Msg
          type: string
        type:
          title: Type
          type: string
      required:
      - loc
      - msg
      - type
      title: FieldError
      type: object
    Finding:
      additionalProperties: false
      description: Result of one transparent rule. Concerns and unknowns always say what to check next.
      properties:
        category:
          $ref: '#/components/schemas/FindingCategory'
        facts:
          items:
            $ref: '#/components/schemas/CitedFact'
          title: Facts
          type: array
        id:
          minLength: 1
          title: Id
          type: string
        next_step:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Step
        outcome:
          $ref: '#/components/schemas/Outcome'
        reason:
          title: Reason
          type: string
        rule_id:
          minLength: 1
          title: Rule Id
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - rule_id
      - category
      - outcome
      - title
      - reason
      title: Finding
      type: object
    FindingCategory:
      enum:
      - cost
      - access
      - location
      - condition
      - missing_info
      title: FindingCategory
      type: string
    Health:
      properties:
        status:
          title: Status
          type: string
      required:
      - status
      title: Health
      type: object
    Likelihood:
      description: Screening signal strength. Always phrased as a possibility, never a diagnosis.
      enum:
      - unlikely
      - possible
      - likely
      - insufficient_evidence
      title: Likelihood
      type: string
    MainFuel:
      enum:
      - mains_gas
      - electricity
      - other
      title: MainFuel
      type: string
    Origin:
      description: Where a value came from.
      enum:
      - listing
      - public_data
      - user
      - model
      - estimate
      title: Origin
      type: string
    Outcome:
      description: Result of a single requirement check. ``unknown`` is not the same as ``concern``.
      enum:
      - meets
      - concern
      - unknown
      title: Outcome
      type: string
    PhotoScreen:
      additionalProperties: false
      description: 'Screening of one photo. The image is processed in memory and never stored, so there
        is

        no upload id and nothing to delete.'
      properties:
        evidence_quality:
          anyOf:
          - $ref: '#/components/schemas/EvidenceQuality'
          - type: 'null'
          description: Image quality gate result; null when the screener couldn't assess it.
        signals:
          description: Possible issues to inspect, never diagnoses. May be empty.
          items:
            $ref: '#/components/schemas/Signal'
          title: Signals
          type: array
      required:
      - evidence_quality
      - signals
      title: PhotoScreen
      type: object
    Priority:
      description: Renter priorities used to decide which checks apply and how they are ordered.
      enum:
      - total_cost
      - step_free_access
      - lift_access
      - transport_access
      - travel_time
      - heating_cost
      - space
      - nearby_schools
      - property_condition
      title: Priority
      type: string
    ProblemDetail:
      additionalProperties: false
      description: RFC 9457 problem details (`application/problem+json`).
      properties:
        detail:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Detail
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/FieldError'
            type: array
          - type: 'null'
          default: null
          description: Field-level validation errors (422 only).
          title: Errors
        instance:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Instance
        status:
          maximum: 599
          minimum: 400
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          default: about:blank
          description: URI identifying the problem type.
          title: Type
          type: string
      required:
      - title
      - status
      title: ProblemDetail
      type: object
    ProfileInput:
      additionalProperties: false
      description: A renter profile as submitted by a client. The server assigns the id.
      properties:
        access:
          $ref: '#/components/schemas/AccessRequirements'
        destinations:
          items:
            $ref: '#/components/schemas/Destination'
          title: Destinations
          type: array
        label:
          description: Display name for the profile, e.g. a persona name.
          title: Label
          type: string
        monthly_budget_gbp:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - type: 'null'
          title: Monthly Budget Gbp
        other_recurring_costs:
          items:
            $ref: '#/components/schemas/RecurringCost'
          title: Other Recurring Costs
          type: array
        priorities:
          items:
            $ref: '#/components/schemas/Priority'
          title: Priorities
          type: array
      required:
      - label
      title: ProfileInput
      type: object
    ProfileList:
      additionalProperties: false
      description: A list wrapper, so pagination fields can be added later without breaking clients.
      properties:
        items:
          items:
            $ref: '#/components/schemas/RenterProfile'
          title: Items
          type: array
      required:
      - items
      title: ProfileList
      type: object
    Property:
      additionalProperties: false
      properties:
        area:
          anyOf:
          - type: string
          - type: 'null'
          description: Neighbourhood, never a house number.
          title: Area
        bedrooms:
          $ref: '#/components/schemas/Evidence_int_'
        council_tax_band:
          $ref: '#/components/schemas/Evidence_CouncilTaxBand_'
        entrance_steps:
          $ref: '#/components/schemas/Evidence_int_'
          description: Number of steps at the entrance.
        epc_rating:
          $ref: '#/components/schemas/Evidence_EpcBand_'
        floor_area_m2:
          $ref: '#/components/schemas/Evidence_float_'
        floor_level:
          $ref: '#/components/schemas/Evidence_int_'
          description: 0 = ground floor.
        has_lift:
          $ref: '#/components/schemas/Evidence_bool_'
        id:
          minLength: 1
          title: Id
          type: string
        illustrative:
          default: false
          description: True when this is a fictional example, not a real listing.
          title: Illustrative
          type: boolean
        latitude:
          anyOf:
          - maximum: 90.0
            minimum: -90.0
            type: number
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - maximum: 180.0
            minimum: -180.0
            type: number
          - type: 'null'
          title: Longitude
        main_fuel:
          $ref: '#/components/schemas/Evidence_MainFuel_'
        other_recurring_costs:
          items:
            $ref: '#/components/schemas/RecurringCost'
          title: Other Recurring Costs
          type: array
        property_type:
          $ref: '#/components/schemas/Evidence_PropertyType_'
        rent_pcm_gbp:
          $ref: '#/components/schemas/Evidence_float_'
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - rent_pcm_gbp
      - bedrooms
      - property_type
      - floor_area_m2
      - council_tax_band
      - epc_rating
      - main_fuel
      - floor_level
      - has_lift
      - entrance_steps
      title: Property
      type: object
    PropertyInput:
      additionalProperties: false
      description: 'A property as submitted by a client. The server assigns the id.


        Every fact carries its own provenance; a value the client doesn''t have is sent as

        ``{"value": null, "status": "insufficient", ...}``, never left out or defaulted.'
      properties:
        area:
          anyOf:
          - type: string
          - type: 'null'
          description: Neighbourhood, never a house number.
          title: Area
        bedrooms:
          $ref: '#/components/schemas/Evidence_int_'
        council_tax_band:
          $ref: '#/components/schemas/Evidence_CouncilTaxBand_'
        entrance_steps:
          $ref: '#/components/schemas/Evidence_int_'
          description: Number of steps at the entrance.
        epc_rating:
          $ref: '#/components/schemas/Evidence_EpcBand_'
        floor_area_m2:
          $ref: '#/components/schemas/Evidence_float_'
        floor_level:
          $ref: '#/components/schemas/Evidence_int_'
          description: 0 = ground floor.
        has_lift:
          $ref: '#/components/schemas/Evidence_bool_'
        illustrative:
          default: false
          description: True when this is a fictional example, not a real listing.
          title: Illustrative
          type: boolean
        latitude:
          anyOf:
          - maximum: 90.0
            minimum: -90.0
            type: number
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - maximum: 180.0
            minimum: -180.0
            type: number
          - type: 'null'
          title: Longitude
        main_fuel:
          $ref: '#/components/schemas/Evidence_MainFuel_'
        other_recurring_costs:
          items:
            $ref: '#/components/schemas/RecurringCost'
          title: Other Recurring Costs
          type: array
        property_type:
          $ref: '#/components/schemas/Evidence_PropertyType_'
        rent_pcm_gbp:
          $ref: '#/components/schemas/Evidence_float_'
        title:
          title: Title
          type: string
      required:
      - title
      - rent_pcm_gbp
      - bedrooms
      - property_type
      - floor_area_m2
      - council_tax_band
      - epc_rating
      - main_fuel
      - floor_level
      - has_lift
      - entrance_steps
      title: PropertyInput
      type: object
    PropertyList:
      additionalProperties: false
      description: A list wrapper, so pagination fields can be added later without breaking clients.
      properties:
        items:
          items:
            $ref: '#/components/schemas/Property'
          title: Items
          type: array
      required:
      - items
      title: PropertyList
      type: object
    PropertyType:
      enum:
      - flat
      - maisonette
      - house
      - bungalow
      - other
      title: PropertyType
      type: string
    ReadAloudRequest:
      additionalProperties: false
      description: Text to turn into speech. The maximum length is set by HAVEN_READ_ALOUD_MAX_CHARS.
      properties:
        text:
          description: Plain text to read aloud.
          minLength: 1
          title: Text
          type: string
      required:
      - text
      title: ReadAloudRequest
      type: object
    RecurringCost:
      additionalProperties: false
      description: A named recurring monthly cost (e.g. broadband, factor fee) in GBP.
      properties:
        label:
          minLength: 1
          title: Label
          type: string
        monthly_gbp:
          $ref: '#/components/schemas/Evidence_float_'
      required:
      - label
      - monthly_gbp
      title: RecurringCost
      type: object
    RenterProfile:
      additionalProperties: false
      properties:
        access:
          $ref: '#/components/schemas/AccessRequirements'
        destinations:
          items:
            $ref: '#/components/schemas/Destination'
          title: Destinations
          type: array
        id:
          minLength: 1
          title: Id
          type: string
        label:
          description: Display name for the profile, e.g. a persona name.
          title: Label
          type: string
        monthly_budget_gbp:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - type: 'null'
          title: Monthly Budget Gbp
        other_recurring_costs:
          items:
            $ref: '#/components/schemas/RecurringCost'
          title: Other Recurring Costs
          type: array
        priorities:
          items:
            $ref: '#/components/schemas/Priority'
          title: Priorities
          type: array
      required:
      - id
      - label
      title: RenterProfile
      type: object
    Report:
      additionalProperties: false
      properties:
        cost:
          anyOf:
          - $ref: '#/components/schemas/CostBreakdown'
          - type: 'null'
        created_at:
          format: date-time
          title: Created At
          type: string
        disclaimer:
          default: Haven is a prototype and decision-support tool. It is not a legal, safety, accessibility
            or compliance certification system. Its assessments are indicative and should be checked against
            the property in person and with appropriate professional advice.
          title: Disclaimer
          type: string
        findings:
          items:
            $ref: '#/components/schemas/Finding'
          title: Findings
          type: array
        id:
          minLength: 1
          title: Id
          type: string
        illustrative:
          default: false
          description: True when the report is an illustrative example.
          title: Illustrative
          type: boolean
        profile:
          $ref: '#/components/schemas/RenterProfile'
        property:
          $ref: '#/components/schemas/Property'
        sections:
          items:
            $ref: '#/components/schemas/ReportSection'
          title: Sections
          type: array
        signals:
          items:
            $ref: '#/components/schemas/Signal'
          title: Signals
          type: array
      required:
      - id
      - created_at
      - profile
      - property
      title: Report
      type: object
    ReportSection:
      additionalProperties: false
      properties:
        heading:
          title: Heading
          type: string
        sentences:
          items:
            $ref: '#/components/schemas/ReportSentence'
          title: Sentences
          type: array
      required:
      - heading
      title: ReportSection
      type: object
    ReportSentence:
      additionalProperties: false
      properties:
        cites:
          description: Ids of the findings/signals this sentence relies on.
          items:
            type: string
          title: Cites
          type: array
        text:
          title: Text
          type: string
      required:
      - text
      title: ReportSentence
      type: object
    Signal:
      additionalProperties: false
      description: 'A screening signal from uploaded evidence: a possibility to inspect, not a diagnosis.'
      properties:
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Calibrated confidence, when available.
          title: Confidence
        evidence_quality:
          $ref: '#/components/schemas/EvidenceQuality'
        id:
          minLength: 1
          title: Id
          type: string
        kind:
          $ref: '#/components/schemas/SignalKind'
        likelihood:
          $ref: '#/components/schemas/Likelihood'
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        source:
          description: Screener name and version.
          minLength: 1
          title: Source
          type: string
        upload_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Upload Id
      required:
      - id
      - kind
      - likelihood
      - evidence_quality
      - source
      title: Signal
      type: object
    SignalKind:
      description: Scoped screening signals. Each is a *possible* feature to inspect.
      enum:
      - possible_damp
      - possible_mould
      - entrance_step
      title: SignalKind
      type: string
    Status:
      description: How much a value can be relied on.
      enum:
      - known
      - estimated
      - inferred
      - uncertain
      - insufficient
      title: Status
      type: string
    SuitabilityAssessment:
      additionalProperties: false
      description: Per-requirement indicators. There is deliberately no aggregate result.
      properties:
        findings:
          items:
            $ref: '#/components/schemas/Finding'
          title: Findings
          type: array
        profile_id:
          minLength: 1
          title: Profile Id
          type: string
        property_id:
          minLength: 1
          title: Property Id
          type: string
      required:
      - property_id
      - profile_id
      title: SuitabilityAssessment
      type: object
    SuitabilityRequest:
      additionalProperties: false
      properties:
        profile_id:
          description: Profile whose requirements to check.
          minLength: 1
          title: Profile Id
          type: string
      required:
      - profile_id
      title: SuitabilityRequest
      type: object
    Upload:
      additionalProperties: false
      properties:
        content_type:
          minLength: 1
          title: Content Type
          type: string
        evidence_quality:
          anyOf:
          - $ref: '#/components/schemas/EvidenceQuality'
          - type: 'null'
          description: Image quality gate result; null for documents.
        extracted_facts:
          description: Facts read from a document, with provenance.
          items:
            $ref: '#/components/schemas/CitedFact'
          title: Extracted Facts
          type: array
        filename:
          minLength: 1
          title: Filename
          type: string
        id:
          minLength: 1
          title: Id
          type: string
        kind:
          $ref: '#/components/schemas/UploadKind'
        metadata_stripped:
          description: True when EXIF/GPS metadata was removed from the stored file.
          title: Metadata Stripped
          type: boolean
        property_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Property Id
        signals:
          items:
            $ref: '#/components/schemas/Signal'
          title: Signals
          type: array
        size_bytes:
          minimum: 0.0
          title: Size Bytes
          type: integer
        uploaded_at:
          format: date-time
          title: Uploaded At
          type: string
      required:
      - id
      - kind
      - filename
      - content_type
      - size_bytes
      - uploaded_at
      - metadata_stripped
      title: Upload
      type: object
    UploadKind:
      enum:
      - photo
      - floor_plan
      - document
      title: UploadKind
      type: string
  securitySchemes:
    Auth0:
      description: 'Auth0 access token for the Haven API (`Authorization: Bearer <token>`).'
      scheme: bearer
      type: http
