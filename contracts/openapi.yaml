        is checked from the file''s content, not its name: anything else is rejected with 415, and larger
        files with 413. Images are stored with EXIF/GPS metadata removed (`metadata_stripped: true`);
        PDFs are stored unchanged. Screening results are possible signals to inspect, never diagnoses;
        a signal may be ''insufficient_evidence''. Screening isn''t built yet, so uploads currently have
        no signals and `evidence_quality: null`. The fixture backend (`HAVEN_BACKEND=fixtures`) does not
