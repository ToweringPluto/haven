  notes: 'Calculated annual heat demand per m2 of floor area for City of Edinburgh dwellings: (SPACE_HEATING_DEMAND
    + WATER_HEATING_DEMAND) / TOTAL_FLOOR_AREA, from the Scottish Government domestic EPC register extract
    (all quarterly CSVs in the release, latest certificate per BUILDING_REFERENCE_NUMBER), computed by
    backend/scripts/ingest_epc.py. These are SAP/RdSAP modelled demands under standardised occupancy,
    not metered use, and heat demand rather than fuel delivered (heating-system efficiency is not applied).
    Lighting is NOT included: the data dictionary has no lighting kWh column (only LIGHTING_COST_CURRENT
    in GBP). Groups are EPC band (CURRENT_ENERGY_RATING) x PROPERTY_TYPE x main heating fuel (MAIN_FUEL;
    when blank, as in most 2025-26 certificates, the first MAINHEAT_DESCRIPTION entry), dropped when n
    < min_group_n; band_groups are the fallback. Community heating and fuels other than mains gas or electricity
    are ''other''. Quartiles use Python''s statistics.quantiles(method=''inclusive''), rounded to 0.1
    kWh/m2. The EPC register is not the whole housing stock (EPCs are only needed on sale, rental or construction).
    ''retrieved'' is the date the archive was downloaded.'
