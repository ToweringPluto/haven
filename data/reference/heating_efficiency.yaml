  notes: 'Default seasonal efficiencies (%) of heating systems from SAP 10.2 (11-04-2023), Table 4a (heating
    systems) and Table 4b (gas and liquid fuel boilers), used when the actual product is unknown. The
    cost engine converts EPC heat demand into fuel bought as heat demand / efficiency. Listings don''t
    say which system a home has, so the engine treats it as unknown: a central assumption per fuel plus
    the range across the listed systems. Only rows marked ''rd'' (the RdSAP reduced data set, the method
    behind EPCs for existing homes) are included; heat pumps needing evidence of a design flow temperature
    <= 35°C (SAP 9.3) are excluded. Space-heating (winter) efficiency is used for both space and water
    heating because the EPC heat demand model combines them; Table 4b''s summer (water heating) efficiencies
    are about 10 points lower, so hot water may be slightly underestimated. Table 4c adjustments (controls,
    flow temperature) are not applied. These are defaults, not measurements of any property''s system.
